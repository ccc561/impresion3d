<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // =================================================================
        // REEMPLAZA TODO LO QUE ESTÁ ENTRE COMILLAS CON TUS DATOS REALES:
        // =================================================================
        
        const SUPABASE_URL       = "https://ddmcsgiaeewelpqfiwbi.supabase.co"; 
        const SUPABASE_ANON_KEY   = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkbWNzZ2lhZWV3ZWxwcWZpd2JpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNzk5NjMsImV4cCI6MjA5Njc1NTk2M30.MUnFBkGLQG19s2HHbmW70TCcdBrpIqwb_Xpp2xuVuVM";
        const THINGIVERSE_TOKEN  = "2459c29910830f90950d75dbd627e442";

        // =================================================================

        let dbCliente = null; // Cambiamos el nombre para que no choque con la librería
        let usuarioActual = null; 

        window.onload = async function() {
            // Inicializar base de datos de forma segura
            if (!SUPABASE_URL.includes("PON_AQUI_TU_URL")) {
                // Usamos la librería global de la ventana del navegador
                dbCliente = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                await verificarUsuario();
            }

            // Revisar si venimos del index con una búsqueda
            const parametrosURL = new URLSearchParams(window.location.search);
            const terminoDeBusqueda = parametrosURL.get('q');

            if (terminoDeBusqueda) {
                document.getElementById('busqueda-galeria').value = terminoDeBusqueda;
                ejecutarBusqueda();
            } else {
                cargarDestacados();
            }
        };

        async function verificarUsuario() {
            if (!dbCliente) return;
            const { data: { session } } = await dbCliente.auth.getSession();
            if (session) {
                usuarioActual = session.user;
                const btnAuth = document.getElementById('btn-auth');
                btnAuth.href = 'dashboard.html';
                btnAuth.innerHTML = '<i class="fas fa-user-circle"></i> Mi Panel';
                btnAuth.style.backgroundColor = '#FFB000'; 
                btnAuth.style.color = '#333';
            }
        }

        async function ejecutarBusqueda() {
            const termino = document.getElementById('busqueda-galeria').value.trim();
            const contenedor = document.getElementById('contenedor-resultados');
            
            if(termino === '') {
                contenedor.innerHTML = '<div class="loading-message">Por favor, ingresa un término de búsqueda.</div>';
                return;
            }

            contenedor.innerHTML = '<div class="loading-message"><i class="fas fa-spinner fa-spin"></i> Buscando en la biblioteca mundial de Thingiverse...</div>';

            // Verificación por si olvidaste poner el token de Thingiverse
            if (THINGIVERSE_TOKEN.includes("PON_AQUI_TU_APP_TOKEN")) {
                contenedor.innerHTML = '<div class="loading-message" style="color: #d9534f;"><i class="fas fa-exclamation-triangle"></i> Falta configurar el Token de Thingiverse en el código.</div>';
                return;
            }

            try {
                const respuesta = await fetch(`https://api.thingiverse.com/search/${encodeURIComponent(termino)}/?access_token=${THINGIVERSE_TOKEN}`);
                
                if (!respuesta.ok) throw new Error("Error al conectar con Thingiverse");

                const datos = await respuesta.json();
                const resultados = datos.hits || datos;

                if (resultados.length === 0) {
                    contenedor.innerHTML = `
                        <div class="loading-message" style="grid-column: 1/-1; padding: 5px 20px;">
                            <i class="fas fa-search-minus" style="font-size: 40px; color: #999; margin-bottom: 15px;"></i><br>
                            No encontramos modelos para <strong>"${termino}"</strong>.<br><br>
                            <span style="font-size: 15px; color: #666;">
                                <i class="fas fa-lightbulb" style="color: #FFB000;"></i> Intenta escribir tu búsqueda en <strong>inglés</strong> para acceder a todo el catálogo mundial.
                            </span>
                        </div>`;
                    return;
                }

                const modelosLimpios = resultados.map(item => ({
                    titulo: item.name,
                    autor: item.creator ? item.creator.name : "Anónimo",
                    img: item.thumbnail || 'https://via.placeholder.com/300x200/555555/FFFFFF?text=Sin+Imagen'
                }));

                renderizarModelos(modelosLimpios);

            } catch (error) {
                console.error(error);
                contenedor.innerHTML = '<div class="loading-message" style="color: red;"><i class="fas fa-exclamation-triangle"></i> Error al cargar los modelos. Revisa tu App Token de Thingiverse.</div>';
            }
        }

        function cargarDestacados() {
            const modelos = [
                { titulo: 'Maceta Groot', autor: 'Diseño Popular', img: 'https://cdn.thingiverse.com/renders/71/34/fb/01/a4/Baby_Groot_Planter_display_large.jpg' },
                { titulo: 'Soporte Auriculares', autor: 'Diseño Útil', img: 'https://cdn.thingiverse.com/renders/24/ce/27/ef/20/Headphone_Stand_display_large.jpg' },
                { titulo: 'Dragón Articulado', autor: 'Tendencia Maker', img: 'https://cdn.thingiverse.com/renders/f2/87/4a/01/5e/Articulated_Dragon_display_large.jpg' }
            ];
            renderizarModelos(modelos);
        }

        function renderizarModelos(modelos) {
            const contenedor = document.getElementById('contenedor-resultados');
            contenedor.innerHTML = ''; 

            modelos.forEach(mod => {
                const tituloSafe = mod.titulo.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                const autorSafe = mod.autor.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                const imgSafe = mod.img;

                contenedor.innerHTML += `
                    <div class="model-card">
                        <div>
                            <img src="${imgSafe}" alt="${tituloSafe}">
                            <h4>${tituloSafe}</h4>
                            <p>Por: ${autorSafe}</p>
                        </div>
                        <div style="padding: 15px;">
                            <button class="btn-cura btn-full" style="background-color: #2b2b2b; font-size: 14px;" 
                                onclick="guardarEnPanel('${tituloSafe}', '${autorSafe}', '${imgSafe}')">
                                <i class="fas fa-bookmark"></i> Guardar en mi panel
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        async function guardarEnPanel(titulo, autor, imagenUrl) {
            if (!usuarioActual || !dbCliente) {
                alert("Debes iniciar sesión con Google para guardar modelos.");
                window.location.href = 'login.html';
                return;
            }

            try {
                const { error } = await dbCliente
                    .from('modelos_guardados')
                    .insert([
                        { 
                            user_id: usuarioActual.id, 
                            titulo: titulo, 
                            autor: autor, 
                            imagen_url: imagenUrl 
                        }
                    ]);

                if (error) throw error;
                mostrarNotificacion();

            } catch (err) {
                console.error("Error guardando el modelo:", err);
                alert("Hubo un error al guardar el modelo. Revisa tu conexión.");
            }
        }

        function mostrarNotificacion() {
            const toast = document.getElementById('toast-notificacion');
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
    </script>
