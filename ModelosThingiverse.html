<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería 3D Nativa - Centro de Impresión</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- ESTILOS DE LA GALERÍA --- */
        .gallery-header { text-align: center; padding: 40px 20px; background-color: var(--card-bg); border-bottom: 1px solid #ddd; }
        .gallery-search-bar { display: flex; justify-content: center; gap: 10px; margin-top: 20px; max-width: 600px; margin-left: auto; margin-right: auto; }
        .gallery-search-bar input { flex: 1; padding: 15px; border: 2px solid #ccc; border-radius: 8px; font-size: 16px; }
        .thingiverse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 40px 20px; max-width: 1200px; margin: 0 auto; }
        
        .model-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s; cursor: pointer; border-bottom: 4px solid var(--cura-blue); }
        .model-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.2); }
        .model-card img { width: 100%; height: 180px; object-fit: cover; }
        .model-card-info { padding: 12px; text-align: center; }

        /* --- MODAL Y VISOR 3D --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 10000; }
        .modal-content { background: white; width: 95%; max-width: 1000px; height: 85vh; border-radius: 12px; display: grid; grid-template-columns: 1.5fr 1fr; overflow: hidden; position: relative; }
        
        #viewer-container { background: #1a1a1a; position: relative; display: flex; align-items: center; justify-content: center; }
        #canvas-3d { width: 100%; height: 100%; cursor: grab; }
        
        .modal-sidebar { padding: 30px; display: flex; flex-direction: column; gap: 20px; border-left: 1px solid #eee; overflow-y: auto; }
        .btn-action { padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; text-align: center; border: none; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; }
        
        .btn-3d-native { background: #0055ff; color: white; }
        .btn-thingiverse { background: #f0f4f8; color: #333; border: 1px solid #ccc; }
        .btn-save-panel { background: #FFB000; color: #333; }
        
        .pagination-container { text-align: center; padding: 40px; }
        #btn-cargar-mas { background: var(--cura-blue); color: white; border: none; padding: 12px 35px; border-radius: 6px; cursor: pointer; display: none; }
        
        #loader-3d { position: absolute; color: white; text-align: center; }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; z-index: 10001; color: #333; background: #eee; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <header class="top-header">
        <a href="index.html" class="btn-header" style="background: #003DF5; color: white; display: flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 6px; font-weight: bold;">
            <i class="fas fa-arrow-left"></i> Volver al Inicio
        </a>
        <div class="logo">Visor 3D Nativo</div>
        <a href="login.html" id="btn-auth" class="btn-header">Iniciar Sesión</a>
    </header>

    <div class="gallery-header">
        <h1>Biblioteca Digital 3D</h1>
        <div class="gallery-search-bar">
            <input type="text" id="busqueda-galeria" placeholder="¿Qué quieres fabricar?" onkeypress="if(event.key === 'Enter') ejecutarBusqueda()">
            <button class="btn-cura" onclick="ejecutarBusqueda()">Buscar</button>
        </div>
    </div>

    <main class="thingiverse-grid" id="contenedor-resultados"></main>

    <div class="pagination-container">
        <button id="btn-cargar-mas" onclick="cargarSiguientePagina()">Ver más diseños</button>
    </div>

    <div class="modal-overlay" id="modal-container">
        <span class="close-modal" onclick="cerrarModal()">&times;</span>
        <div class="modal-content">
            <div id="viewer-container">
                <div id="loader-3d"><i class="fas fa-spinner fa-spin"></i> Cargando motor 3D...</div>
                <canvas id="canvas-3d"></canvas>
            </div>
            <div class="modal-sidebar">
                <h2 id="modal-titulo" style="margin:0; color:#003DF5;">Nombre del Modelo</h2>
                <p><strong>Autor:</strong> <span id="modal-autor">Cargando...</span></p>
                <hr>
                
                <button class="btn-action btn-3d-native" onclick="activar3D()"><i class="fas fa-cube"></i> Vista 3D Interactiva</button>
                <a href="#" id="link-thingiverse" target="_blank" class="btn-action btn-thingiverse"><i class="fas fa-external-link-alt"></i> Ver en Thingiverse</a>
                <button class="btn-action btn-save-panel" id="btn-guardar-panel"><i class="fas fa-bookmark"></i> Guardar en mi Panel</button>
                
                <p style="font-size: 13px; color: #777; margin-top: auto;">* El visor 3D nativo permite inspeccionar la calidad y detalles antes de solicitar la impresión.</p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // CONFIGURACIÓN (Rellena con tus datos)
        const SUPABASE_URL = "https://ddmcsgiaeewelpqfiwbi.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkbWNzZ2lhZWV3ZWxwcWZpd2JpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNzk5NjMsImV4cCI6MjA5Njc1NTk2M30.MUnFBkGLQG19s2HHbmW70TCcdBrpIqwb_Xpp2xuVuVM";
        const THINGIVERSE_TOKEN = "2459c29910830f90950d75dbd627e442";

        let dbCliente = null;
        let usuarioActual = null;
        let pagina = 1;
        let busqueda = "";

        // MOTOR 3D
        let scene, camera, renderer, controls, mesh;

        window.onload = async function() {
            if (window.supabase) {
                dbCliente = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const { data: { session } } = await dbCliente.auth.getSession();
                usuarioActual = session?.user;
                if (usuarioActual) {
                    const btn = document.getElementById('btn-auth');
                    btn.href = 'dashboard.html'; btn.innerHTML = 'Mi Panel';
                }
            }
            ejecutarBusqueda(true);
            init3DEngine();
        };

        function init3DEngine() {
            const container = document.getElementById('viewer-container');
            const canvas = document.getElementById('canvas-3d');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 1000);
            camera.position.set(0, 0, 100);
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.5));
            animate();
        }

        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }

        async function ejecutarBusqueda(primeraVez = false) {
            const input = document.getElementById('busqueda-galeria').value.trim();
            if(!primeraVez && input === "") return;
            pagina = 1; busqueda = input;
            const url = busqueda 
                ? `https://api.thingiverse.com/search/${encodeURIComponent(busqueda)}?page=${pagina}&access_token=${THINGIVERSE_TOKEN}`
                : `https://api.thingiverse.com/newest?page=${pagina}&access_token=${THINGIVERSE_TOKEN}`;
            
            fetchModelos(url);
        }

        async function fetchModelos(url) {
            const res = await fetch(url);
            const data = await res.json();
            const hits = data.hits || data;
            const grid = document.getElementById('contenedor-resultados');
            if(pagina === 1) grid.innerHTML = "";
            
            hits.forEach(item => {
                const div = document.createElement('div');
                div.className = 'model-card';
                div.onclick = () => abrirDetalle(item);
                div.innerHTML = `<img src="${item.thumbnail}"> <div class="model-card-info"><h4>${item.name}</h4><p>${item.creator.name}</p></div>`;
                grid.appendChild(div);
            });
            document.getElementById('btn-cargar-mas').style.display = hits.length >= 20 ? "inline-block" : "none";
        }

        function abrirDetalle(item) {
            document.getElementById('modal-titulo').innerText = item.name;
            document.getElementById('modal-autor').innerText = item.creator.name;
            document.getElementById('link-thingiverse').href = item.public_url;
            document.getElementById('modal-container').style.display = 'flex';
            document.getElementById('btn-guardar-panel').onclick = () => guardar(item);
            
            // Simular carga de archivo STL (Thingiverse API requiere fetch de archivos)
            // Aquí activaríamos el cargador STL real si el ID del archivo está disponible
        }

        function cerrarModal() { document.getElementById('modal-container').style.display = 'none'; }

        async function guardar(item) {
            if(!usuarioActual) { alert("Inicia sesión para guardar"); return; }
            await dbCliente.from('modelos_guardados').insert([{ user_id: usuarioActual.id, titulo: item.name, autor: item.creator.name, imagen_url: item.thumbnail }]);
            alert("Guardado en tu panel!");
        }
    </script>
</body>
</html>
