<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Centro de Impresión 3D</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-card">
            
            <div class="login-header">
                <a href="index.html" class="back-home" style="text-decoration: none; color: var(--text-color); font-weight: bold;"><i class="fas fa-arrow-left"></i> Volver</a>
                <div class="login-logo" style="color: var(--cura-blue); font-weight: bold; font-size: 24px;">Centro 3D</div>
            </div>

            <div id="alert-container"></div>

            <div style="margin: 30px 0; text-align: center;">
                <p style="margin-bottom: 15px; color: #666;">Accede de forma rápida y segura para gestionar tus impresiones</p>
                
                <button id="btn-google" class="btn-cura btn-full" style="display: inline-flex; align-items: center; justify-content: center; gap: 12px; font-size: 16px; border: none; cursor: pointer; background-color: var(--cura-blue); color: white; padding: 14px; width: 100%; border-radius: 8px;">
                    <span style="background: white; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;">
                        <i class="fab fa-google" style="background: linear-gradient(45deg, #4285F4, #EA4335, #FBBC05, #34A353); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 14px;"></i>
                    </span>
                    Iniciar Sesión con Google
                </button>
            </div>

            <div class="auth-switch" style="text-align: center; border-top: 1px solid #eee; padding-top: 15px;">
                <p style="font-size: 13px; color: #888;">Al iniciar sesión aceptas nuestras condiciones de servicio local.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // ==========================================
        // CONFIGURACIÓN DE SUPABASE
        // ==========================================
        const SUPABASE_URL = "https://ddmcsgiaeewelpqfiwbi.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkbWNzZ2lhZWV3ZWxwcWZpd2JpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNzk5NjMsImV4cCI6MjA5Njc1NTk2M30.MUnFBkGLQG19s2HHbmW70TCcdBrpIqwb_Xpp2xuVuVM";

        let dbCliente = null;

        window.onload = function() {
            if (window.supabase) {
                dbCliente = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        };

        document.getElementById('btn-google').addEventListener('click', async () => {
            // VALIDACIÓN: Evitar error si se abre el archivo localmente (doble clic)
            if (window.location.protocol === 'file:') {
                mostrarError("¡Atención! Google no permite iniciar sesión abriendo el archivo HTML directamente con doble clic. Debes usar un servidor local o subirlo a Vercel.");
                return;
            }

            if (!dbCliente) {
                mostrarError("Error al inicializar la base de datos. Revisa tu conexión.");
                return;
            }

            try {
                const { data, error } = await dbCliente.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        // Redirección exitosa hacia el panel de usuario
                        redirectTo: window.location.origin + '/dashboard.html' 
                    }
                });

                if (error) throw error;
            } catch (error) {
                mostrarError("No se pudo conectar con Google: " + error.message);
            }
        });

        function mostrarError(mensaje) {
            const container = document.getElementById('alert-container');
            container.innerHTML = `
                <div class="alert alert-error" style="background-color: #f8d7da; color: #721c24; padding: 15px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; text-align: left; border: 1px solid #f5c6cb;">
                    <i class="fas fa-exclamation-circle"></i> ${mensaje}
                </div>
            `;
        }
    </script>

</body>
</html>
