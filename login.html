<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Centro de Impresión 3D</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-card">
            
            <div class="login-header">
                <a href="index.html" class="back-home" style="text-decoration: none; color: var(--text-color); font-weight: bold;"><i class="fas fa-arrow-left"></i> Volver</a>
                <div class="login-logo" style="color: var(--cura-blue); font-weight: bold; font-size: 24px;">Centro 3D</div>
            </div>

            <div id="alert-container"></div>

            <div style="margin: 30px 0; text-align: center;">
                <p style="margin-bottom: 15px; color: #666;">Accede de forma rápida y segura para gestionar tus impresiones</p>
                <button id="btn-google" style="background-color: #ffffff; color: #1f1f1f; display: inline-flex; align-items: center; justify-content: center; gap: 12px; border: 1px solid #747775; padding: 12px 24px; font-size: 16px; font-weight: 500; border-radius: 4px; width: 100%; cursor: pointer; transition: background-color .218s;">
                    <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/web-24dp/logo_googleg_color_24dp.png" alt="Google Logo" style="width: 20px; height: 20px;">
                    Iniciar Sesión con Google
                </button>
            </div>

            <div class="auth-switch" style="text-align: center; border-top: 1px solid #eee; padding-top: 15px;">
                <p style="font-size: 13px; color: #888;">Al iniciar sesión aceptas nuestras condiciones de servicio local.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // REEMPLAZA ESTOS DATOS con tu URL y Anon Key reales de Supabase
        const SUPABASE_URL = "https://TU_PROYECTO_AQUÍ.supabase.co"; 
        const SUPABASE_ANON_KEY = "TU_LLAVE_ANON_AQUÍ";

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('btn-google').addEventListener('click', async () => {
            // VALIDACIÓN DEL ERROR: Comprobamos si estás abriendo el archivo como 'file://'
            if (window.location.protocol === 'file:') {
                mostrarError("¡Atención! Google no permite iniciar sesión abriendo el archivo HTML directamente con doble clic. Necesitas ejecutar un servidor local (usa la extensión 'Live Server' de VS Code o súbelo a Vercel).");
                return;
            }

            try {
                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + '/dashboard.html' 
                    }
                });

                if (error) throw error;
            } catch (error) {
                mostrarError("No se pudo conectar con Google: " + error.message);
            }
        });

        function mostrarError(mensaje) {
            const container = document.getElementById('alert-container');
            container.innerHTML = `
                <div class="alert alert-error" style="background-color: #f8d7da; color: #721c24; padding: 15px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; text-align: left; border: 1px solid #f5c6cb;">
                    <i class="fas fa-exclamation-circle"></i> ${mensaje}
                </div>
            `;
        }
    </script>

</body>
</html>
